<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Buttons and Text</title>
</head>
<body style="text-align:center; font-family:Arial;">

<!-- buttons -->
<div style="border:2px solid black;">
    <button style="color:blue;">Click me 1</button>
    <button style="color:blue;">Click me 2</button>
    <button style="color:blue;">Click me 3</button>
    <button style="color:blue;">Click me 4</button>
    <button style="color:blue;">Click me 5</button>
</div>

<!-- paragraphs -->
<div style="border:2px solid black;">
    <p style="color:blue; font-size:20px;">Hello everyone</p>
    <p style="color:blue; font-size:20px;">This is my first paragraph</p>
    <p style="color:blue; font-size:20px;">I like coding</p>
    <p style="color:blue; font-size:20px;">HTML is fun</p>
    <p style="color:blue; font-size:20px;">Learning new things</p>
    <p style="color:blue; font-size:20px;">I like blue text</p>
    <p style="color:blue; font-size:20px;">This is the last one</p>
</div>

<!-- extra div -->
<div style="border:2px solid black;">
    <p style="color:blue;">Just some extra text here</p>
</div>

</body>
</html>
