<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!--section – გვერდის ნაწილი (მაგ: about, contact)
article – დამოუკიდებელი კონტენტი (მაგ: ბლოგი)
aside – გვერდითი ინფორმაცია (მაგ: რეკლამა)-->

<h1 style="color:red; text-align:center;">Title</h1>

<p style="color:blue; font-size:20px;">Paragraph</p>

<div style="background-color:gray; border:2px solid black;">
    div text
</div>

h1 style="color:red; text-align:center;">Title</h1>

<p style="color:blue; font-size:20px; text-align:center;">
ეს არის პარაგრაფი
</p>

<div style="background-color:gray; border:2px solid black; text-align:center;">
Div ტექსტი
</div>

<!--
CSS გამოიყენება საიტის გასალამაზებლად.
გამოყენებული properties:
color - ტექსტის ფერი
background-color - ფონი
text-align - ტექსტის მდებარეობა
font-size - ტექსტის ზომა
border - ბორდერი
width - სიგანე
border-radius - კუთხეების დამრგვალება-->

<!-- Inline CSS არის, როცა სტილი პირდაპირ HTML თეგში წერენ style ატრიბუტით -->
<p style="color:red;">ეს ტექსტი წითელია</p>

</body>
</html>
